[workspace]
resolver = "2"
members = ["ambisync", "ambisync_macros", "ambisync_tests"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/LDeakin/ambisync"
keywords = ["async", "sync", "macro", "generic"]
categories = ["asynchronous", "rust-patterns"]

[workspace.dependencies]
ambisync_macros = { version = "0.1.1", path = "ambisync_macros" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
