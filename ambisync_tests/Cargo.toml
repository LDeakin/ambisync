[package]
name = "ambisync_tests"
description = "Integration tests for ambisync (not published)"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["async", "sync"]
async = []
sync = []

[lib]
# Test-only crate: everything lives in `tests/`.
path = "src/lib.rs"

[dev-dependencies]
ambisync = { path = "../ambisync" }
async-trait = "0.1"
inherent = "1.0.13"
tokio = { version = "1", features = ["rt", "macros"] }
trybuild = "1"

# Not `workspace = true`: test items need no docs.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Fixtures model async APIs without real I/O, so their async fns need not await.
unused_async = "allow"
unused_async_trait_impl = "allow"
# Fixture and derived test functions are not an API, so `#[must_use]` would only add noise.
must_use_candidate = "allow"
# Fixture methods model stateful APIs whose results need no state.
unused_self = "allow"
# Fixtures model runtime APIs, and derived sync functions cannot be `const` in their async-written source.
missing_const_for_fn = "allow"
# Fixtures spell out type names to exercise their substitution in the derived sync code.
use_self = "allow"
# Async tests run on a current-thread runtime, and some fixtures are deliberately not `Send`.
future_not_send = "allow"
