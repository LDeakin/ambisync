[package]
name = "ambisync_tests"
description = "Integration tests for ambisync (not published)"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["async", "sync"]
async = []
sync = []

[lib]
# Test-only crate: everything lives in `tests/`.
path = "src/lib.rs"

[dev-dependencies]
ambisync = { path = "../ambisync" }
async-trait = "0.1"
inherent = "1.0.13"
tokio = { version = "1", features = ["rt", "macros"] }
trybuild = "1"

# Not `workspace = true`: test items need no docs.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Fixtures model async APIs without real I/O, so their async fns need not await.
unused_async = "allow"
unused_async_trait_impl = "allow"
