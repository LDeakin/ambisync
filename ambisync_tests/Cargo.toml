[package]
name = "ambisync_tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Integration tests for ambisync (not published)"

[features]
default = ["async", "sync"]
async = []
sync = []

[lib]
# Test-only crate: everything lives in `tests/`.
path = "src/lib.rs"

[dev-dependencies]
ambisync = { path = "../ambisync" }
async-trait = "0.1"
inherent = "1.0.13"
tokio = { version = "1", features = ["rt", "macros"] }
trybuild = "1"
