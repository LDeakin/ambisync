[package]
name = "ambisync_tests"
description = "Integration tests for ambisync (not published)"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = ["async", "sync"]
async = []
sync = []

[lib]
# Test-only crate: everything lives in `tests/`.
path = "src/lib.rs"

[dev-dependencies]
ambisync = { path = "../ambisync" }
async-trait = "0.1"
inherent = "1.0.13"
tokio = { version = "1", features = ["rt", "macros"] }
trybuild = "1"
