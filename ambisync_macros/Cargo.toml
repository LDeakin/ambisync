[package]
name = "ambisync_macros"
description = "Proc-macro implementation for the ambisync crate"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/ambisync_macros"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit-mut"] }

[lints]
workspace = true
